[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultos-invites"
version = "0.1.0"
description = "One-time access code manager for Vault OS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["vault", "invites", "access-codes", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
]

[project.scripts]
invites = "invites.cli:main"

[tool.setuptools.packages.find]
include = ["invites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["invites"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
